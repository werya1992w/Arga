<head>

<style>
:root{--bg:#fff;--fg:#1c1c1c;--mut:#737373;--line:#e6e6e6;--chip:#f3f3f3;--font:Vazirmatn,system-ui,sans-serif;--grad:linear-gradient(45deg,#e0a766,#b87333,#7a4a26);--accent:#b87333;--ring:#dbdbdb;--navbg:rgba(255,255,255,.92)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f5;--mut:#a3a3a3;--line:#262626;--chip:#1a1a1a;--ring:#3a3a3a;--navbg:rgba(0,0,0,.85)}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f5;--mut:#a3a3a3;--line:#262626;--chip:#1a1a1a;--ring:#3a3a3a;--navbg:rgba(0,0,0,.85)}
#btnTheme{position:relative;width:26px;height:26px}
#btnTheme svg{position:absolute;inset:0;transition:opacity .25s ease,transform .4s cubic-bezier(.22,1,.36,1),filter .25s ease}
:root[data-theme="dark"] .ic-moon,:root:not([data-theme="dark"]) .ic-sun{opacity:0;transform:scale(.4) rotate(-90deg);filter:blur(2px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic-moon{opacity:0;transform:scale(.4) rotate(-90deg);filter:blur(2px)}:root:not([data-theme="light"]) .ic-sun{opacity:1;transform:none;filter:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);max-width:560px;margin:0 auto;padding-bottom:76px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header.top{padding-top:calc(10px + env(safe-area-inset-top))!important;position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:26px;letter-spacing:.5px;font-family:var(--font)}.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .ic{display:flex;gap:16px}
svg.i{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.profile{display:flex;align-items:center;gap:22px;padding:16px}
.avatar{width:84px;height:84px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#7dff9b,#16c455 45%,#0a9d3f);flex:none}
.avatar img{width:100%;height:100%;border-radius:50%;display:block;border:3px solid var(--bg);object-fit:cover}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px}.stats span{font-size:12.5px;color:var(--mut)}
.bio{padding:0 16px 10px;font-size:14px;line-height:1.9}
.bio h1{font-size:15px;margin:0}.bio .cat{color:var(--fg);font-size:15px;font-weight:800}
.actions{display:flex;gap:8px;padding:6px 16px 14px}
.actions a,.actions button{flex:1;text-align:center;background:var(--chip);border-radius:9px;padding:8px;font-size:13.5px;font-weight:600;text-decoration:none;color:inherit}
.actions .pri{background:#b87333;color:#fff}
.stories{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;font-size:11px;line-height:1.5;padding:0}
.story .ring{flex:none}
.story .lb{display:block;width:100%;height:3em;overflow:hidden}
.ring{width:66px;height:66px;border-radius:50%;padding:2.5px;background:var(--line);margin-bottom:5px}
.story.on .ring{background:var(--grad)}
.ring div{overflow:hidden}
.ring div img{width:100%;height:100%;object-fit:cover;display:block}
.ring div.cut{background:radial-gradient(circle at 50% 40%,#f6e6cf,#d3ad82)}
.ring div.cut img{object-fit:contain;padding:3px}
.ring div{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--bg);display:grid;place-items:center;font-size:28px;background:var(--chip)}
.tabs{display:flex;border-top:1px solid var(--line);position:sticky;top:calc(49px + env(safe-area-inset-top));background:var(--bg);z-index:15}
.tabs button{flex:1;padding:11px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.search{display:none;padding:10px 16px}
.search.show{display:block}
.search input{width:100%;background:var(--chip);border:0;border-radius:10px;padding:10px 14px;font:inherit;color:var(--fg);outline:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:1;overflow:hidden;display:grid;place-items:center;cursor:pointer;color:#fff}
.tile .em{font-size:44px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.tile img,.post img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .nm{display:block;position:absolute;bottom:0;right:0;left:0;padding:14px 6px 5px;font-size:11.5px;font-weight:600;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.tile img.cut,.post img.ph.cut{object-fit:contain;padding:9% 7%;filter:drop-shadow(0 10px 12px rgba(40,20,5,.45))}
.tile.cutbg,.post .media.cutbg{background:radial-gradient(circle at 50% 38%,#f6e6cf 0%,#dcb98f 55%,#b98a5e 100%)!important}
.cutbg .em{display:none}
.tile img.fit,.post img.ph.fit{object-fit:contain;background:#fff}
.cap .rw{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cap .price{font-weight:800;white-space:nowrap}
.cap .dsc{color:var(--mut);font-size:13px;line-height:1.8;margin-top:1px}
.tile img~.em,.media img~.em{display:none}
.list{display:none}
.post{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:6px}
.post .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13.5px;font-weight:600}
.post .hd .av{width:32px;height:32px;border-radius:50%;background:url(images/logo-96.png) center/cover}
.post .media{position:relative;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;color:#fff}
.post .media .em{font-size:110px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.post .bar{display:flex;align-items:center;padding:10px 14px 4px;gap:14px}
.post .bar .sp{flex:1}
.heart.on svg{fill:#ed4956;stroke:#ed4956}
.post .cap{padding:2px 14px;font-size:14px;line-height:1.9}
.price{font-weight:800}
.empty{padding:40px;text-align:center;color:var(--mut);display:none}
nav.bottom{position:fixed;bottom:0;right:50%;transform:translateX(50%);width:100%;max-width:560px;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
nav.bottom button{padding:4px 14px;color:var(--mut)}
nav.bottom button.on{color:var(--fg)}
nav.bottom button.on svg{stroke-width:2.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .card{background:var(--bg);width:100%;max-width:420px;border-radius:14px;overflow:hidden;max-height:92vh;overflow-y:auto}
.neon-foot{display:table;margin:22px auto 10px;padding:4px 10px;font-size:12px;font-weight:300;color:#5a14b8;
  text-shadow:0 0 4px rgba(176,76,255,.8),0 0 10px rgba(150,60,255,.6),0 0 22px rgba(122,44,255,.45);animation:neonFoot 2.6s ease-in-out infinite alternate}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .neon-foot{color:#f3e6ff}}
:root[data-theme="dark"] .neon-foot{color:#f3e6ff}
.neon-foot a{color:inherit;text-decoration:none}
@keyframes neonFoot{from{text-shadow:0 0 3px rgba(176,76,255,.7),0 0 8px rgba(150,60,255,.45),0 0 16px rgba(122,44,255,.3)}to{text-shadow:0 0 6px rgba(200,110,255,.95),0 0 14px rgba(160,70,255,.8),0 0 30px rgba(122,44,255,.65),0 0 48px rgba(122,44,255,.35)}}
@media(prefers-reduced-motion:reduce){.neon-foot{animation:none}}
[data-nav="fav"]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
[data-nav="fav"].hold svg{animation:heartHold 3s linear forwards;transform-origin:center}
@keyframes heartHold{0%{transform:scale(1);filter:drop-shadow(0 0 0 #7fd8ff)}100%{transform:scale(1.45);filter:drop-shadow(0 0 8px #7fd8ff) drop-shadow(0 0 16px #38b6ff)}}
.ice{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}
.ice-glow{position:fixed;inset:0;z-index:89;pointer-events:none;opacity:0;animation:iceGlow 3s ease-in forwards;background:radial-gradient(ellipse at center,rgba(160,215,255,0) 25%,rgba(150,210,255,.45) 70%,rgba(225,245,255,.8) 100%);box-shadow:inset 0 0 50px 12px rgba(220,244,255,.9),inset 0 0 130px 40px rgba(90,170,240,.55);-webkit-backdrop-filter:blur(1.5px) saturate(1.2);backdrop-filter:blur(1.5px) saturate(1.2)}
@keyframes iceGlow{0%{opacity:0}100%{opacity:1}}
.ice-out{animation:iceOut .9s ease-in forwards}
@keyframes iceOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
.ice-flash{position:fixed;inset:0;z-index:92;pointer-events:none;background:#fff;opacity:0;animation:iceFlash .35s ease-out}
@keyframes iceFlash{0%{opacity:.85}100%{opacity:0}}
.cd{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);z-index:95;pointer-events:none;font-size:72px;font-weight:800;line-height:1;color:#effaff;-webkit-text-stroke:1.5px #1b6fa8;text-shadow:0 0 8px rgba(0,40,80,.5),0 0 16px #38b6ff,0 0 36px #1e90ff;animation:cdPop 1s ease-out}
@keyframes cdPop{0%{transform:translateX(-50%) scale(1.8);opacity:0}25%{opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
.burst{position:fixed;z-index:100;pointer-events:none;white-space:nowrap;font-weight:300;color:var(--fg);text-shadow:0 0 6px #7fd8ff,0 0 14px #38b6ff;opacity:0;animation:burst 1.5s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}12%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(var(--s))}}
@media(prefers-reduced-motion:reduce){.cd,.ice-glow,.ice-flash{animation:none}.ice-glow{opacity:.8}.ice-flash{display:none}}
.toast{position:fixed;bottom:90px;right:50%;transform:translateX(50%);background:#262626;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:60}
.toast.show{opacity:1}
.info{padding:16px;line-height:2;font-size:14px}
.info h2{font-size:16px;margin:8px 0}
.info .row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.gal-hd{display:flex;align-items:center;padding:14px 14px 4px}
.gal-hd h2{font-size:16px;margin:0;flex:1;text-align:center}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:4px}
.gal-grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;display:block}
.gal-view{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:70}
.gal-view.show{display:flex}
.gal-view img{max-width:100%;max-height:100%;object-fit:contain}
.gal-view button{position:absolute;top:16px;left:16px;color:#fff;font-size:26px}

header.top{display:grid!important;grid-template-columns:1fr auto 1fr;border-bottom:0!important}
header.top .ic{justify-self:end;gap:14px}
.uname{display:flex;align-items:center;gap:5px;font-weight:800;font-size:18px;letter-spacing:.2px}
.avatar{width:86px;height:86px}
.stats b{font-size:17px;font-weight:800}.stats span{font-size:13px;color:var(--fg)}
.bio h1,.bio .cat{font-size:14.5px}
.actions{gap:6px}
.actions a,.actions button{background:var(--chip);border-radius:10px;padding:8px 6px;font-size:13.5px;font-weight:700;color:var(--fg)}
.actions .pri{background:#0095f6!important;color:#fff}
.ring{width:64px;height:64px;padding:2px;background:var(--ring)}
.story.on .ring{background:var(--fg)}
.ring div{border-width:3px}
.story{font-size:12px;font-weight:500}
.tabs{border-top:0;border-bottom:1px solid var(--line)}
.tabs button{padding:10px}
.tabs button.on{border-bottom:1.5px solid var(--fg)}
.grid{gap:1px}
.tile{aspect-ratio:3/4}
.tile .nm{font-size:11px;padding:22px 6px 6px;line-height:1.45}
.tile .nn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .np{display:block;font-size:10.5px;font-weight:800;margin-top:1px;opacity:.95;white-space:nowrap}
nav.bottom{border-top:0;padding-top:10px;background:var(--navbg);backdrop-filter:blur(14px)}
nav.bottom button svg{width:27px;height:27px;stroke-width:1.9}
nav.bottom button.on svg{stroke-width:2.6;fill:currentColor}
.navav{width:27px;height:27px;border-radius:50%;display:block;border:1.5px solid transparent}
nav.bottom button.on .navav{border-color:var(--fg)}

:root{--t-ease:cubic-bezier(.22,1,.36,1)}
@keyframes t-fade-in{from{opacity:0}to{opacity:1}}
@keyframes t-fade-out{from{opacity:1}to{opacity:0}}
@keyframes t-pop-in{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes t-pop-out{from{opacity:1;transform:none}to{opacity:0;transform:scale(.96) translateY(6px)}}
@keyframes t-swap{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
.modal.show{animation:t-fade-in .22s ease both}
.modal.show .card{animation:t-pop-in .32s var(--t-ease) both}
.modal.closing{display:flex;pointer-events:none;animation:t-fade-out .18s ease both}
.modal.closing .card{animation:t-pop-out .18s ease both}
.gal-view.show{animation:t-fade-in .22s ease both}
.gal-view.show img{animation:t-pop-in .36s var(--t-ease) both}
.gal-view.closing{display:flex;pointer-events:none;animation:t-fade-out .18s ease both}
.swap{animation:t-swap .34s var(--t-ease) both}
@keyframes t-heart{0%{transform:scale(1)}30%{transform:scale(.72)}60%{transform:scale(1.28)}100%{transform:scale(1)}}
.heart svg{transition:fill .2s ease,stroke .2s ease}
.heart.pop svg{animation:t-heart .45s var(--t-ease)}
@media(prefers-reduced-motion:reduce){
  .heart.pop svg,#btnTheme svg{animation:none!important;transition:none!important}
  .modal.show,.modal.show .card,.modal.closing,.modal.closing .card,.gal-view.show,.gal-view.show img,.gal-view.closing,.swap{animation:none!important}
}
</style>
</head>
<body>

<header class="top">
  <button id="btnPlus" aria-label="نصب اپلیکیشن" title="نصب اپلیکیشن" style="justify-self:start"><svg class="i" viewBox="0 0 24 24" style="width:27px;height:27px"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg></button><div class="uname"><span id="unameTxt">Argacafe</span><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px;stroke-width:2.6"><path d="M6 9l6 6 6-6"/></svg></div>
  <div class="ic">
    <button id="btnFont" aria-label="تغییر فونت" title="تغییر فونت"><svg class="i" viewBox="0 0 24 24" style="width:21px;height:21px"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/><text x="10.5" y="13.6" font-size="8.5" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">ف</text></svg></button>
    <button id="btnTheme" aria-label="حالت تاریک / روشن" title="حالت تاریک / روشن"><svg class="i ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8z"/></svg><svg class="i ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg></button>
    <button id="btnFavTop" aria-label="علاقه‌مندی‌ها"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.3 5c2 0 3.8 1.2 5.7 3.3C13.900 6.200 15.700 5 17.700 5 21 5 23.100 8.400 21.600 11.800 19.500 16.400 12 21 12 21z"/></svg></button>
  </div>
</header>

<main id="home">
  <section class="profile">
    <a class="avatar" id="avLink" href="https://instagram.com/Argacafe" target="_blank" rel="noopener" aria-label="اینستاگرام" style="display:block"><img src="images/logo-192.png" alt="لوگوی کافه Arga"></a>
    <div class="stats">
      <div><b id="stItems">0</b><span>آیتم</span></div>
      <div><b id="stCats">0</b><span>دسته‌بندی</span></div>

  <div class="stories" id="stories"></div>

  <div class="tabs">

  <div class="grid" id="grid"></div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty">همچین چیزی تو منو نداریم ☕ یه اسم دیگه امتحان کن</div>

<nav class="bottom">
  <button class="on" data-nav="home" aria-label="خانه"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button>
  <button data-nav="gallery" aria-label="گالری کافه"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 8.5h18M9 3l3 5.5M15 3l3 5.5"/><path d="M10.5 13l4 2.5-4 2.5z" fill="currentColor"/></svg></button>
  <button data-nav="fav" aria-label="علاقه‌مندی‌ها"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.3 5c2 0 3.8 1.2 5.7 3.3C13.9 6.2 15.7 5 17.7 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg></button>
  <button data-nav="search" aria-label="جستجو"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>

<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div class="gal-view" id="galView"><button data-closeGal>✕</button><img id="galImg" alt=""></div>

function openLayer(el){clearTimeout(el._ct);el.classList.remove("closing");el.classList.add("show")}
function closeLayer(el){
  if(!el.classList.contains("show"))return;
  el.classList.remove("show");el.classList.add("closing");
  clearTimeout(el._ct);el._ct=setTimeout(()=>el.classList.remove("closing"),200);
}

}

function openItem(id){

    <div class="bar"><button class="heart ${favs.has(i.id)?"on":""}" data-fav="${i.id}">${heartSvg}</button><span class="sp"></span></div>

function setNav(n){
  $$("nav.bottom button").forEach(b=>b.classList.toggle("on",b.dataset.nav===n));
}
function toggleFav(id){
  id=+id;favs.has(id)?favs.delete(id):favs.add(id);saveFavs();
  $$(`[data-fav="${id}"]`).forEach(b=>{
    b.classList.toggle("on",favs.has(id));
    if(favs.has(id)){b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");setTimeout(()=>b.classList.remove("pop"),500)}
  });
  if(onlyFav)render();
}

document.addEventListener("click",e=>{
  const t=e.target;
  const s=t.closest("[data-cat]");if(s){
    const oi=CATS.findIndex(c=>c.id===cat),ni=CATS.findIndex(c=>c.id===s.dataset.cat);
    animDir=ni===oi&&!onlyFav?null:(ni>oi?-28:28);
    cat=s.dataset.cat;onlyFav=false;render();setNav("home");return}
  if(t.closest("#btnInstall,#btnPlus")){installApp();return}
  const f=t.closest("[data-fav]");if(f){toggleFav(f.dataset.fav);return}
  if(t.closest("[data-close]")||t===$("#modal")){closeLayer($("#modal"));return}
  if(t.closest("[data-closeGal]")||t===$("#galView")){closeLayer($("#galView"));return}
  const g=t.closest("[data-gal]");if(g){$("#galImg").src=GALLERY[+g.dataset.gal];openLayer($("#galView"));return}
  const tile=t.closest(".tile,.media");if(tile&&tile.dataset.id){openItem(tile.dataset.id);return}
  const tab=t.closest(".tabs button");if(tab){if(view!==tab.dataset.view)animDir=0;view=tab.dataset.view;$$(".tabs button").forEach(b=>b.classList.toggle("on",b===tab));render();return}
  const nav=t.closest("[data-nav]");
  if(nav){
    const n=nav.dataset.nav;if(n!=="gallery")setNav(n);
    if(n==="home"||n==="all"){onlyFav=false;cat="all";query="";$("#q").value="";$("#searchBox").classList.remove("show");render();window.scrollTo({top:0,behavior:"smooth"})}
    if(n==="search"){$("#searchBox").classList.add("show");$("#q").focus()}
    if(n==="fav"){onlyFav=true;cat="all";render();window.scrollTo({top:0,behavior:"smooth"});if(!favs.size)toast("آیتم‌هایی که دوست داری لایک کن")}
    if(n==="gallery")openGallery();
    if(n==="info")openInfo();
  }
});

addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e});
addEventListener("appinstalled",()=>{deferredPrompt=null;toast("اپلیکیشن نصب شد ✅")});
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
function installApp(){
  if(INSTALLED){toast("اپلیکیشن قبلاً نصب شده است ✅");return}
  if(deferredPrompt){const d=deferredPrompt;deferredPrompt=null;d.prompt();return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  $("#card").innerHTML=`<div class="info"><button style="float:left;font-size:22px" data-close>✕</button>
   <img src="images/logo-192.png" alt="" width="72" height="72" style="display:block;margin:6px auto;border-radius:50%">

   <div class="row">2️⃣ <div>گزینه‌ی <b dir="ltr">Add to Home Screen</b> را انتخاب کنید</div></div>
   <div class="row">3️⃣ <div>روی <b dir="ltr">Add</b> بزنید</div></div>`
   :`<div class="row">1️⃣ <div>منوی مرورگر (⋮ بالا) را باز کنید</div></div>
   <div class="row">2️⃣ <div>گزینه‌ی <b dir="ltr">Install app</b> یا <b dir="ltr">Add to Home screen</b> را بزنید</div></div>
   <div class="row">3️⃣ <div>روی <b>نصب</b> بزنید؛ اپ تمام‌صفحه باز می‌شود</div></div>`}
   <div class="row" style="border:0;color:var(--mut);font-size:12.5px">اگر گزینه‌ی نصب را نمی‌بینید، سایت را با Chrome یا Safari (نه از داخل برنامه‌های دیگر) باز کنید.</div></div>`;
  openModal();
}

const FONTS=[
 ["وزیرمتن","Vazirmatn:wght@300;400;600;800","Vazirmatn"],
 ["نسخ","Noto+Naskh+Arabic:wght@400;600;700","Noto Naskh Arabic"],

const themeMeta=document.querySelector('meta[name="theme-color"]');

$("#btnShare").onclick=async()=>{
  try{if(navigator.share){await navigator.share({title:"کافه Arga",url:location.href})}else{await navigator.clipboard.writeText(location.href);toast("لینک کپی شد")}}catch(e){}
};
(()=>{
  const WORDS=["Made","By","AI:","An","Idiot"],URL_="https://kurd.cc",HOLD=3000;
  const reduce=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
  function openSite(){const w=window.open(URL_,"_blank");if(w){try{w.opener=null}catch(e){}}else location.href=URL_}
  function burst(x,y){
    const W=innerWidth,H=innerHeight;
    for(let i=0;i<44;i++){
      const s=document.createElement("span");s.className="burst";s.textContent=WORDS[i%WORDS.length];
      const a=Math.random()*Math.PI*2,d=Math.max(W,H)*(.45+Math.random()*.6);
      s.style.cssText=`left:${x}px;top:${y}px;font-size:${12+Math.floor(Math.random()*20)}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--r:${Math.round((Math.random()-.5)*120)}deg;--s:${(.8+Math.random()*1.2).toFixed(2)};animation-delay:${(Math.random()*.2).toFixed(2)}s`;
      document.body.appendChild(s);setTimeout(()=>s.remove(),2000);
    }
    try{navigator.vibrate&&navigator.vibrate([40,40,80])}catch(e){}
  }
  let AC=null,pendingSound=false;
  function unlock(){
    try{
      if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C()}
      if(AC.state==="suspended")AC.resume();
    }catch(e){}
  }
  ["touchend","pointerup","click","keydown"].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
  function playShatter(){
    try{
      if(!AC){pendingSound=true;return}
      if(AC.state==="suspended"){AC.resume();}
      if(AC.state!=="running"){pendingSound=true;return}
      pendingSound=false;
      const t=AC.currentTime,out=AC.createGain();out.gain.value=.9;out.connect(AC.destination);
      const len=Math.floor(AC.sampleRate*.35),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
      const ns=AC.createBufferSource();ns.buffer=buf;
      const bp=AC.createBiquadFilter();bp.type="bandpass";bp.frequency.value=4200;bp.Q.value=.6;
      const ng=AC.createGain();ng.gain.setValueAtTime(1,t);ng.gain.exponentialRampToValueAtTime(.001,t+.3);
      ns.connect(bp);bp.connect(ng);ng.connect(out);ns.start(t);
      for(let i=0;i<34;i++){
        const st=t+.02+Math.pow(Math.random(),1.6)*1.1,f=2200+Math.random()*7500;
        const o=AC.createOscillator();o.type=Math.random()<.5?"sine":"triangle";o.frequency.value=f;
        const g=AC.createGain(),pk=.05+Math.random()*.16;
        g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(pk,st+.004);g.gain.exponentialRampToValueAtTime(.0008,st+.06+Math.random()*.16);
        o.connect(g);g.connect(out);o.start(st);o.stop(st+.28);
      }
    }catch(e){}
  }
  let ice=null;
  function startIce(){
    const cv=document.createElement("canvas");cv.className="ice";
    const W=innerWidth,H=innerHeight,sc=Math.min(devicePixelRatio||1,2);cv.width=W*sc;cv.height=H*sc;
    const glow=document.createElement("div");glow.className="ice-glow";
    document.body.append(glow,cv);
    const ctx=cv.getContext("2d");ctx.scale(sc,sc);ctx.lineCap="round";
    const tips=[],t0=performance.now();let raf=0,alive=true;
    function spawn(){
      const e=Math.random();let x,y,a;
      if(e<.3){x=Math.random()*W;y=0;a=Math.PI/2}
      else if(e<.6){x=Math.random()*W;y=H;a=-Math.PI/2}
      else if(e<.8){x=0;y=Math.random()*H;a=0}
      else{x=W;y=Math.random()*H;a=Math.PI}
      tips.push({x,y,a:a+(Math.random()-.5)*.7,len:0,max:40+Math.random()*(70+W*.12),w:1.2+Math.random()*1.6,br:0});
    }
    function frame(now){
      if(!alive)return;
      const k=Math.min((now-t0)/HOLD,1);
      const n=Math.floor(1+k*6);for(let i=0;i<n&&tips.length<160;i++)spawn();
      for(let i=tips.length-1;i>=0;i--){
        const p=tips[i],st=3+Math.random()*3,na=p.a+(Math.random()-.5)*.55;
        const nx=p.x+Math.cos(na)*st,ny=p.y+Math.sin(na)*st;
        ctx.strokeStyle=`rgba(${215+Math.random()*30|0},${240+Math.random()*15|0},255,${.55+Math.random()*.4})`;
        ctx.lineWidth=p.w*(1-p.len/p.max*.6);
        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(nx,ny);ctx.stroke();
        p.x=nx;p.y=ny;p.a=na;p.len+=st;
        if(p.br>2.5&&Math.random()<.04&&p.len<p.max*.7){tips.push({x:p.x,y:p.y,a:p.a+(Math.random()<.5?-1:1)*(.7+Math.random()*.5),len:p.len,max:p.max,w:p.w*.7,br:0});p.br=0}
        p.br+=st;
        if(p.len>=p.max)tips.splice(i,1);
      }
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
    ice={cv,glow,shatter(cx,cy){
      alive=false;cancelAnimationFrame(raf);
      const flash=document.createElement("div");flash.className="ice-flash";document.body.appendChild(flash);setTimeout(()=>flash.remove(),400);
      ctx.strokeStyle="rgba(255,255,255,.95)";ctx.shadowColor="#7fd8ff";ctx.shadowBlur=8;
      const R=Math.hypot(W,H);
      for(let i=0;i<22;i++){
        let a=Math.random()*Math.PI*2,x=cx,y=cy,len=0,max=R*(.35+Math.random()*.7);
        ctx.lineWidth=1+Math.random()*1.8;ctx.beginPath();ctx.moveTo(x,y);
        while(len<max){const st=16+Math.random()*26;a+=(Math.random()-.5)*.55;x+=Math.cos(a)*st;y+=Math.sin(a)*st;len+=st;ctx.lineTo(x,y)}
        ctx.stroke();
      }
      ctx.shadowBlur=0;
      cv.classList.add("ice-out");glow.classList.add("ice-out");
    },stop(){alive=false;cancelAnimationFrame(raf);cv.remove();glow.remove()}};
  }
  function stopIce(){if(ice){ice.stop();ice=null}}
  let cd=null;
  function showNum(n){if(!cd){cd=document.createElement("div");document.body.appendChild(cd)}cd.className="cd";cd.textContent=String(n);cd.style.animation="none";void cd.offsetWidth;cd.style.animation=""}
  function hideNum(){if(cd){cd.remove();cd=null}}
  const btn=$('[data-nav="fav"]');if(!btn)return;
  let timers=[],sx=0,sy=0,active=false;
  const clearAll=()=>{timers.forEach(clearTimeout);timers=[]};
  const stop=()=>{if(!active)return;active=false;clearAll();btn.classList.remove("hold");hideNum();stopIce()};
  btn.addEventListener("pointerdown",e=>{
    sx=e.clientX;sy=e.clientY;stop();active=true;unlock();
    btn.classList.add("hold");showNum(3);
    if(!reduce())startIce();
    timers.push(setTimeout(()=>showNum(2),1000),setTimeout(()=>showNum(1),2000));
    timers.push(setTimeout(()=>{
      active=false;clearAll();btn.classList.remove("hold");hideNum();
      const eat=ev=>{ev.stopPropagation();ev.preventDefault()};
      document.addEventListener("click",eat,{capture:true,once:true});
      setTimeout(()=>document.removeEventListener("click",eat,true),1800);
      const r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      playShatter();
      if(reduce()){openSite();return}
      if(ice)ice.shatter(cx,cy);
      burst(cx,cy);
      setTimeout(()=>{openSite();setTimeout(stopIce,1000)},1300);
    },HOLD));
  });
  document.addEventListener("pointerup",()=>{if(pendingSound)setTimeout(playShatter,30)},{passive:true});
  btn.addEventListener("pointermove",e=>{if(active&&Math.hypot(e.clientX-sx,e.clientY-sy)>14)stop()});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>btn.addEventListener(ev,stop));
  btn.addEventListener("contextmenu",e=>e.preventDefault());
})();
render();
</script>
