<style>
:root{--bg:#fff;--fg:#1c1c1c;--mut:#737373;--line:#e6e6e6;--chip:#f3f3f3;--font:Vazirmatn,system-ui,sans-serif;--grad:linear-gradient(45deg,#e0a766,#b87333,#7a4a26);--accent:#b87333;--ring:#dbdbdb;--navbg:rgba(255,255,255,.92)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f5;--mut:#a3a3a3;--line:#262626;--chip:#1a1a1a;--ring:#3a3a3a;--navbg:rgba(0,0,0,.85)}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f5;--mut:#a3a3a3;--line:#262626;--chip:#1a1a1a;--ring:#3a3a3a;--navbg:rgba(0,0,0,.85)}
:root[data-theme="dark"] .ic-moon,:root:not([data-theme="dark"]) .ic-sun{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic-moon{display:none}:root:not([data-theme="light"]) .ic-sun{display:block}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);max-width:560px;margin:0 auto;padding-bottom:76px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header.top{padding-top:calc(10px + env(safe-area-inset-top))!important;position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:26px;letter-spacing:.5px;font-family:var(--font)}.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .ic{display:flex;gap:16px}
svg.i{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.profile{display:flex;align-items:center;gap:22px;padding:16px}
.avatar{width:84px;height:84px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#7dff9b,#16c455 45%,#0a9d3f);flex:none}
.avatar img{width:100%;height:100%;border-radius:50%;display:block;border:3px solid var(--bg);object-fit:cover}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px}.stats span{font-size:12.5px;color:var(--mut)}
.bio{padding:0 16px 10px;font-size:14px;line-height:1.9}
.bio h1{font-size:15px;margin:0}.bio .cat{color:var(--fg);font-size:15px;font-weight:800}
.actions{display:flex;gap:8px;padding:6px 16px 14px}
.actions a,.actions button{flex:1;text-align:center;background:var(--chip);border-radius:9px;padding:8px;font-size:13.5px;font-weight:600;text-decoration:none;color:inherit}
.actions .pri{background:#b87333;color:#fff}
.stories{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;font-size:11px;line-height:1.5;padding:0}
.story .ring{flex:none}
.story .lb{display:block;width:100%;height:3em;overflow:hidden}
.ring{width:66px;height:66px;border-radius:50%;padding:2.5px;background:var(--line);margin-bottom:5px}
.story.on .ring{background:var(--grad)}
.ring div{overflow:hidden}
.ring div img{width:100%;height:100%;object-fit:cover;display:block}
.ring div.cut{background:radial-gradient(circle at 50% 40%,#f6e6cf,#d3ad82)}
.ring div.cut img{object-fit:contain;padding:3px}
.ring div{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--bg);display:grid;place-items:center;font-size:28px;background:var(--chip)}
.tabs{display:flex;border-top:1px solid var(--line);position:sticky;top:calc(49px + env(safe-area-inset-top));background:var(--bg);z-index:15}
.tabs button{flex:1;padding:11px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.search{display:none;padding:10px 16px}
.search.show{display:block}
.search input{width:100%;background:var(--chip);border:0;border-radius:10px;padding:10px 14px;font:inherit;color:var(--fg);outline:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:1;overflow:hidden;display:grid;place-items:center;cursor:pointer;color:#fff}
.tile .em{font-size:44px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.tile img,.post img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .nm{display:block;position:absolute;bottom:0;right:0;left:0;padding:14px 6px 5px;font-size:11.5px;font-weight:600;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.tile img.cut,.post img.ph.cut{object-fit:contain;padding:9% 7%;filter:drop-shadow(0 10px 12px rgba(40,20,5,.45))}
.tile.cutbg,.post .media.cutbg{background:radial-gradient(circle at 50% 38%,#f6e6cf 0%,#dcb98f 55%,#b98a5e 100%)!important}
.cutbg .em{display:none}
.tile img.fit,.post img.ph.fit{object-fit:contain;background:#fff}
.cap .rw{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cap .price{font-weight:800;white-space:nowrap}
.cap .dsc{color:var(--mut);font-size:13px;line-height:1.8;margin-top:1px}
.tile img~.em,.media img~.em{display:none}
.list{display:none}
.post{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:6px}
.post .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13.5px;font-weight:600}
.post .hd .av{width:32px;height:32px;border-radius:50%;background:url(images/logo-96.png) center/cover}
.post .media{position:relative;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;color:#fff}
.post .media .em{font-size:110px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.post .bar{display:flex;align-items:center;padding:10px 14px 4px;gap:14px}
.post .bar .sp{flex:1}
.heart.on svg{fill:#ed4956;stroke:#ed4956}
.post .cap{padding:2px 14px;font-size:14px;line-height:1.9}
.price{font-weight:800}
.empty{padding:40px;text-align:center;color:var(--mut);display:none}
nav.bottom{position:fixed;bottom:0;right:50%;transform:translateX(50%);width:100%;max-width:560px;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
nav.bottom button{padding:4px 14px;color:var(--mut)}
nav.bottom button.on{color:var(--fg)}
nav.bottom button.on svg{stroke-width:2.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .card{background:var(--bg);width:100%;max-width:420px;border-radius:14px;overflow:hidden;max-height:92vh;overflow-y:auto}
.toast{position:fixed;bottom:90px;right:50%;transform:translateX(50%);background:#262626;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:60}
.toast.show{opacity:1}
.info{padding:16px;line-height:2;font-size:14px}
.info h2{font-size:16px;margin:8px 0}
.info .row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.gal-hd{display:flex;align-items:center;padding:14px 14px 4px}
.gal-hd h2{font-size:16px;margin:0;flex:1;text-align:center}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:4px}
.gal-grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;display:block}
.gal-view{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:70}
.gal-view.show{display:flex}
.gal-view img{max-width:100%;max-height:100%;object-fit:contain}
.gal-view button{position:absolute;top:16px;left:16px;color:#fff;font-size:26px}

/* ===== پیش‌نمایش: ظاهر آخرین نسخه‌ی اینستاگرام ===== */
header.top{display:grid!important;grid-template-columns:1fr auto 1fr;border-bottom:0!important}
header.top .ic{justify-self:end;gap:14px}
.uname{display:flex;align-items:center;gap:5px;font-weight:800;font-size:18px;letter-spacing:.2px}
.avatar{width:86px;height:86px}
.stats b{font-size:17px;font-weight:800}.stats span{font-size:13px;color:var(--fg)}
.bio h1,.bio .cat{font-size:14.5px}
.actions{gap:6px}
.actions a,.actions button{background:var(--chip);border-radius:10px;padding:8px 6px;font-size:13.5px;font-weight:700;color:var(--fg)}
.actions .pri{background:#0095f6!important;color:#fff}
.ring{width:64px;height:64px;padding:2px;background:var(--ring)}
.story.on .ring{background:var(--fg)}
.ring div{border-width:3px}
.story{font-size:12px;font-weight:500}
.tabs{border-top:0;border-bottom:1px solid var(--line)}
.tabs button{padding:10px}
.tabs button.on{border-bottom:1.5px solid var(--fg)}
.grid{gap:1px}
.tile{aspect-ratio:3/4}
.tile .nm{font-size:11px;padding:22px 6px 6px;line-height:1.45}
.tile .nn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .np{display:block;font-size:10.5px;font-weight:800;margin-top:1px;opacity:.95;white-space:nowrap}
nav.bottom{border-top:0;padding-top:10px;background:var(--navbg);backdrop-filter:blur(14px)}
nav.bottom button svg{width:27px;height:27px;stroke-width:1.9}
nav.bottom button.on svg{stroke-width:2.6;fill:currentColor}
.navav{width:27px;height:27px;border-radius:50%;display:block;border:1.5px solid transparent}
nav.bottom button.on .navav{border-color:var(--fg)}
</style>
</head>

document.addEventListener("click",e=>{
  const t=e.target;

  if(t.closest("#btnInstall,#btnPlus")){installApp();return}
  const f=t.closest("[data-fav]");if(f){toggleFav(f.dataset.fav);return}
  if(t.closest("[data-close]")||t===$("#modal")){$("#modal").classList.remove("show");return}
  if(t.closest("[data-closeGal]")||t===$("#galView")){$("#galView").classList.remove("show");return}
  const g=t.closest("[data-gal]");if(g){$("#galImg").src=GALLERY[+g.dataset.gal];$("#galView").classList.add("show");return}
  const tile=t.closest(".tile,.media");if(tile&&tile.dataset.id){openItem(tile.dataset.id);return}
  const tab=t.closest(".tabs button");if(tab){view=tab.dataset.view;$$(".tabs button").forEach(b=>b.classList.toggle("on",b===tab));render();return}
  const nav=t.closest("[data-nav]");
  if(nav){
    const n=nav.dataset.nav;if(n!=="gallery")setNav(n);
    if(n==="home"||n==="all"){onlyFav=false;cat="all";query="";$("#q").value="";$("#searchBox").classList.remove("show");render();window.scrollTo({top:0,behavior:"smooth"})}
